[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "smartdesk-ai"
version = "0.1.0"
description = "SmartDesk AI: an IT & HR help desk agent (RAG, Jira tickets, HITL approval)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-sqlite>=3.1,<4",
    "langchain-core>=1.7,<2",
    "langchain-openai>=1.7,<2",
    "langfuse>=5.1,<6",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.16,<3",
    "chromadb>=1.5,<2",
    "chainlit>=2.12,<3",
    "httpx>=0.28,<1",
    "numpy>=2.5,<3",
    "pyyaml>=6.0,<7",
    "tiktoken>=0.14,<1",
]

[project.optional-dependencies]
dev = ["pytest>=9.2,<10", "ruff>=0.16,<0.18"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]  # pycodestyle errors, pyflakes, import order

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "openai_live: calls the real OpenAI API (skipped unless OPENAI_API_KEY is set and SMARTDESK_LIVE_TESTS=1)",
    "jira_live: calls the real Jira Cloud API (skipped unless JIRA_* credentials are set and SMARTDESK_LIVE_TESTS=1)",
    "rubric(*lines): capstone rubric lines this test covers; `python -m smartdesk.eval.coverage` builds the table",
]
